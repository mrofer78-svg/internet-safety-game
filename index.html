<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internet Safety Tic-Tac-Toe</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header {
    text-align: center;
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    color: #38bdf8;
    letter-spacing: -0.5px;
  }
  header p {
    font-size: 0.85rem;
    color: #94a3b8;
    margin-top: 4px;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 420px;
    margin-bottom: 14px;
  }
  .badge {
    font-size: 13px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
  }
  .badge-x { background: #1e40af; color: #bfdbfe; }
  .badge-o { background: #854d0e; color: #fef3c7; }
  .turn-label { font-size: 13px; color: #94a3b8; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 420px;
    width: 100%;
  }
  .cell {
    aspect-ratio: 1;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
    text-align: center;
    padding: 10px;
    color: #94a3b8;
    transition: background 0.15s, border-color 0.15s;
    line-height: 1.3;
  }
  .cell:hover:not(.taken) {
    background: #263249;
    border-color: #38bdf8;
    color: #cbd5e1;
  }
  .cell.taken { cursor: default; }
  .cell .mark {
    font-size: 2.2rem;
    font-weight: 700;
  }
  .cell.x-cell { background: #1e3a8a; border-color: #3b82f6; color: #bfdbfe; }
  .cell.o-cell { background: #78350f; border-color: #f59e0b; color: #fef3c7; }
  .cell.win-cell { background: #14532d; border-color: #22c55e; }
  .result-banner {
    max-width: 420px;
    width: 100%;
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    display: none;
  }
  .result-banner.show { display: block; }
  .result-banner.win { background: #14532d; color: #86efac; border: 1px solid #22c55e; }
  .result-banner.draw { background: #1e293b; color: #94a3b8; border: 1px solid #475569; }
  .restart-btn {
    display: block;
    margin: 12px auto 0;
    max-width: 420px;
    width: 100%;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #94a3b8;
    transition: background 0.12s, color 0.12s;
  }
  .restart-btn:hover { background: #1e293b; color: #e2e8f0; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
  }
  .modal-subtitle {
    font-size: 12px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .modal-question {
    font-size: 16px;
    font-weight: 600;
    color: #f1f5f9;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .modal-tip {
    font-size: 12px;
    color: #475569;
    margin-bottom: 14px;
    font-style: italic;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .opt-btn {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 11px 8px;
    font-size: 13px;
    cursor: pointer;
    color: #cbd5e1;
    transition: background 0.12s, border-color 0.12s;
    text-align: center;
    line-height: 1.3;
  }
  .opt-btn:hover { background: #1e293b; border-color: #38bdf8; }
  .opt-btn.correct { background: #14532d; color: #86efac; border-color: #22c55e; }
  .opt-btn.wrong   { background: #450a0a; color: #fca5a5; border-color: #ef4444; }
  .feedback {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.4;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { background: #052e16; color: #86efac; border: 1px solid #166534; }
  .feedback.wrong-fb   { background: #300; color: #fca5a5; border: 1px solid #7f1d1d; }
</style>
</head>
<body>

<header>
  <h1>🛡️ Internet Safety</h1>
  <p>Answer correctly to claim your square!</p>
</header>

<div class="status-bar">
  <div style="display:flex;gap:10px;">
    <span class="badge badge-x" id="score-x">X: 0</span>
    <span class="badge badge-o" id="score-o">O: 0</span>
  </div>
  <span class="turn-label" id="turn-label">Turn: X</span>
</div>

<div class="board" id="board"></div>
<div class="result-banner" id="result-banner"></div>
<button class="restart-btn" onclick="restartGame()">🔄 New game</button>

<div class="modal-overlay" id="modal" style="display:none;">
  <div class="modal-box">
    <div class="modal-subtitle" id="modal-subtitle">Your turn — answer to claim!</div>
    <div class="modal-question" id="modal-question"></div>
    <div class="modal-tip" id="modal-tip"></div>
    <div class="options" id="modal-options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
const questions = [
  {
    q: "A stranger online asks for your home address. What should you do?",
    opts: ["Share it — they seem friendly", "Ignore and block them", "Give your school address instead", "Ask them why they need it"],
    a: 1,
    tip: "Never share personal info (address, phone, school) with strangers online."
  },
  {
    q: "Which is a STRONG password?",
    opts: ["password123", "your birthday", "Tr!g3r$Blue#9", "your pet's name"],
    a: 2,
    tip: "Strong passwords mix uppercase, lowercase, numbers and symbols. Never use personal info."
  },
  {
    q: "You receive an email saying you won a prize. It asks you to click a link. This is most likely…",
    opts: ["A real prize!", "A phishing scam", "From your school", "A news alert"],
    a: 1,
    tip: "Phishing emails trick you into clicking fake links to steal your info. Never click suspicious links."
  },
  {
    q: "What does 'cyberbullying' mean?",
    opts: ["Playing violent games", "Harassing someone online", "Hacking a website", "Sharing funny memes"],
    a: 1,
    tip: "Cyberbullying is using technology to harass, threaten or humiliate someone."
  },
  {
    q: "Which information is safe to share publicly on social media?",
    opts: ["Your full name & school", "Your daily schedule", "A hobby or favourite movie", "Your phone number"],
    a: 2,
    tip: "General interests are safe. Personal details like location, school or schedule are not."
  },
  {
    q: "Someone is cyberbullying you. What is the BEST first step?",
    opts: ["Bully them back", "Delete your account forever", "Save evidence & tell a trusted adult", "Share it with classmates"],
    a: 2,
    tip: "Take screenshots as evidence and report it to a trusted adult or platform."
  },
  {
    q: "What does 'two-factor authentication' (2FA) protect you from?",
    opts: ["Computer viruses", "Unauthorised account access", "Slow internet", "Too many passwords"],
    a: 1,
    tip: "2FA adds a second verification step so hackers can't log in even if they know your password."
  },
  {
    q: "A pop-up says your computer has a virus and to call a phone number. You should…",
    opts: ["Call the number immediately", "Close the pop-up — it's a scam", "Give your credit card details", "Download the suggested software"],
    a: 1,
    tip: "These are tech support scams. Legitimate companies don't contact you this way."
  },
  {
    q: "Which is the safest way to use public Wi-Fi?",
    opts: ["Log into your bank account", "Share passwords with friends", "Avoid sensitive activities", "Turn off your firewall"],
    a: 2,
    tip: "Public Wi-Fi is unsecured. Avoid banking, shopping or logging into important accounts."
  },
];

let board, currentPlayer, scores, pendingCell, answered;

function init() {
  board = Array(9).fill(null);
  currentPlayer = 'X';
  pendingCell = null;
  answered = false;
  document.getElementById('result-banner').classList.remove('show','win','draw');
  renderBoard();
  updateStatus();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  board.forEach((val, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell' + (val ? ' taken ' + (val==='X' ? 'x-cell' : 'o-cell') : '');
    if (val) {
      cell.innerHTML = `<span class="mark">${val}</span>`;
    } else {
      const words = questions[i].q.split(' ');
      cell.textContent = words.slice(0,6).join(' ') + (words.length>6 ? '…' : '');
      cell.onclick = () => openModal(i);
    }
    el.appendChild(cell);
  });
}

function updateStatus() {
  document.getElementById('turn-label').textContent = `Turn: ${currentPlayer}`;
  document.getElementById('score-x').textContent = `X: ${scores.X}`;
  document.getElementById('score-o').textContent = `O: ${scores.O}`;
}

function openModal(idx) {
  if (board[idx]) return;
  pendingCell = idx;
  answered = false;
  const q = questions[idx];
  document.getElementById('modal-question').textContent = q.q;
  document.getElementById('modal-subtitle').textContent = `${currentPlayer}'s turn — answer to claim this square!`;
  document.getElementById('modal-tip').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').textContent = '';
  const optsEl = document.getElementById('modal-options');
  optsEl.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = () => answer(i, q.a, btn, q.tip);
    optsEl.appendChild(btn);
  });
  document.getElementById('modal').style.display = 'flex';
}

function answer(chosen, correct, btn, tip) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach((b,i) => { if(i===correct) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');

  if (chosen === correct) {
    btn.classList.add('correct');
    fb.textContent = '✅ Correct! ' + tip;
    fb.className = 'feedback show correct-fb';
    setTimeout(() => {
      document.getElementById('modal').style.display = 'none';
      board[pendingCell] = currentPlayer;
      renderBoard();
      const winner = checkWinner();
      if (winner) {
        highlightWin(winner.cells);
        scores[currentPlayer]++;
        updateStatus();
        showBanner(`${currentPlayer} wins this round! 🎉`, 'win');
      } else if (board.every(v => v)) {
        showBanner("It's a draw! Well played.", 'draw');
      } else {
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
      }
    }, 1800);
  } else {
    btn.classList.add('wrong');
    fb.textContent = '❌ Wrong! ' + tip;
    fb.className = 'feedback show wrong-fb';
    setTimeout(() => {
      document.getElementById('modal').style.display = 'none';
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();
    }, 2200);
  }
}

function checkWinner() {
  const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  for (const line of lines) {
    const [a,b,c] = line;
    if (board[a] && board[a]===board[b] && board[b]===board[c])
      return {player: board[a], cells: line};
  }
  return null;
}

function highlightWin(cells) {
  const cellEls = document.getElementById('board').children;
  cells.forEach(i => cellEls[i].classList.add('win-cell'));
}

function showBanner(msg, type) {
  const el = document.getElementById('result-banner');
  el.textContent = msg;
  el.className = `result-banner show ${type}`;
}

function restartGame() { init(); }

scores = {X:0, O:0};
init();
</script>
</body>
</html>
